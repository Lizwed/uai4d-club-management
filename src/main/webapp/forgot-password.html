<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAI4D Club - Forgot Password</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    
    <div class="auth-card">
        
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <h1>Forgot <span>Password</span></h1>
            <p class="subtitle">Enter your email to receive a reset link</p>
        </div>
        
        <!-- Alert Container -->
        <div class="alert-container" id="alertContainer"></div>
        
        <!-- Forgot Password Form -->
        <form id="forgotForm" action="ForgotPasswordServlet" method="POST" novalidate>
            
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" class="form-control" id="email" name="email" 
                       placeholder="Enter your registered email" required autocomplete="email">
                <div class="invalid-feedback">Please enter a valid email address</div>
            </div>
            
            <button type="submit" class="btn-primary" id="forgotBtn">
                <span class="btn-text"><i class="fas fa-paper-plane"></i> Send Reset Link</span>
                <span class="spinner-border spinner-border-sm spinner" role="status" aria-hidden="true"></span>
            </button>
            
        </form>
        
        <!-- Login Link -->
        <div class="auth-links">
            Remember your password? <a href="login.html">Sign in</a>
        </div>
        
        <!-- Footer -->
        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Your data is secure with us
        </div>
        
    </div>
    
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/forgot-password.js"></script>

</body>
</html>
