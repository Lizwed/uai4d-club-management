<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAI4D Club - Reset Password</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    
    <div class="auth-card">
        
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-key"></i>
            </div>
            <h1>Reset <span>Password</span></h1>
            <p class="subtitle">Create a new password for your account</p>
        </div>
        
        <!-- Alert Container -->
        <div class="alert-container" id="alertContainer"></div>
        
        <!-- Reset Password Form -->
        <form id="resetForm" action="ResetPasswordServlet" method="POST" novalidate>
            
            <!-- Hidden Token Field -->
            <input type="hidden" id="token" name="token" value="">
            
            <!-- New Password -->
            <div class="form-group">
                <label for="password">New Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Create a strong password" required 
                           autocomplete="new-password" minlength="8" maxlength="100">
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="invalid-feedback">Password must be at least 8 characters</div>
            </div>
            
            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                       placeholder="Confirm your new password" required autocomplete="new-password">
                <div id="passwordMatchMsg" class="match-msg"></div>
                <div class="invalid-feedback">Passwords do not match</div>
            </div>
            
            <!-- Show Password -->
            <div class="show-password-group">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show Password</label>
            </div>
            
            <!-- Reset Button -->
            <button type="submit" class="btn-primary" id="resetBtn">
                <span class="btn-text"><i class="fas fa-save"></i> Reset Password</span>
                <span class="spinner-border spinner-border-sm spinner" role="status" aria-hidden="true"></span>
            </button>
            
        </form>
        
        <!-- Login Link -->
        <div class="auth-links">
            Remember your password? <a href="login.html">Sign in</a>
        </div>
        
        <!-- Footer -->
        <div class="footer-text">
            <i class="fas fa-shield-alt"></i> Your data is secure with us
        </div>
        
    </div>
    
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/reset-password.js"></script>

</body>
</html>
