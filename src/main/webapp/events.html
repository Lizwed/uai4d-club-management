<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAI4D Club - Events</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <style>
        :root {
            --primary-dark: #0a1628;
            --primary-navy: #132044;
            --primary-blue: #1a2a5e;
            --gold: #D4AF37;
            --gold-light: #E8D57A;
            --gold-dark: #B8960F;
            --white: #FFFFFF;
            --light-gray: #f0f2f5;
            --medium-gray: #e4e7ec;
            --dark-gray: #6B7280;
            --text-dark: #111827;
            --text-gray: #4B5563;
            --text-light: #9CA3AF;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            overflow-x: hidden;
        }

        .page-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 24px;
            width: 100%;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 24px;
        }
        
        .page-header h2 {
            font-weight: 800;
            color: var(--text-dark);
            margin: 0;
            font-size: 1.8rem;
        }
        
        .page-header h2 i {
            color: var(--gold);
            margin-right: 10px;
        }
        
        .page-header .subtitle {
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            color: #fff;
        }
        
        .btn-outline-gold {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 20px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-outline-gold:hover {
            background: var(--gold);
            color: #fff;
        }
        
        .btn-delete {
            background: #dc2626 !important;
            color: #fff !important;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .btn-delete:hover {
            background: #b91c1c !important;
            transform: scale(1.05);
        }
        
        .event-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
            transition: var(--transition);
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .event-card .event-date-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--gold);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.3;
            z-index: 2;
        }
        
        .event-card .event-date-badge .day {
            font-size: 1.1rem;
            display: block;
        }
        
        .event-card .event-type {
            display: inline-block;
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            align-self: flex-start;
        }
        
        .event-card h5 {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: var(--text-dark);
            padding-right: 50px;
        }
        
        .event-card .event-meta {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-bottom: 4px;
        }
        
        .event-card .event-meta i {
            width: 18px;
            color: var(--gold);
        }
        
        .event-card .event-description {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin: 8px 0 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }
        
        .event-card .event-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--medium-gray);
            margin-top: auto;
        }
        
        .event-card .event-footer .attendees {
            font-size: 0.75rem;
            color: var(--text-gray);
        }
        
        .event-card .event-footer .attendees i {
            color: var(--gold);
        }
        
        .event-status {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            display: inline-block;
        }
        
        .event-status.upcoming { background: #dbeafe; color: #2563eb; }
        .event-status.ongoing { background: #fef3c7; color: #d97706; }
        .event-status.completed { background: #d1fae5; color: #065f46; }
        .event-status.cancelled { background: #fee2e2; color: #dc2626; }
        
        .btn-register {
            background: var(--gold);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 4px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .btn-register:hover {
            background: var(--gold-dark);
            color: #fff;
        }
        
        .btn-register.registered {
            background: #27ae60;
        }
        
        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        
        .filter-bar .filter-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid var(--medium-gray);
            background: transparent;
            color: var(--text-gray);
            font-size: 0.8rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            white-space: nowrap;
        }
        
        .filter-bar .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        
        .filter-bar .filter-btn.active {
            background: var(--gold);
            border-color: var(--gold);
            color: #fff;
        }
        
        .no-events {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
        }
        
        .no-events i {
            font-size: 3rem;
            color: var(--medium-gray);
            margin-bottom: 15px;
        }
        
        .admin-only {
            display: none;
        }

        /* ===== TOP NAVIGATION ===== */
        .top-nav {
            background: var(--primary-dark);
            padding: 0;
            border-bottom: 3px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            width: 100%;
        }

        .top-nav .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .top-nav .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white);
            text-decoration: none;
            margin-right: auto;
        }

        .top-nav .brand .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .top-nav .brand .brand-text {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .top-nav .brand .brand-text span {
            color: var(--gold);
        }

        .top-nav .brand .brand-text small {
            font-size: 0.55rem;
            font-weight: 400;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 4px;
        }

        .top-nav .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .top-nav .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.8);
            font-size: 0.85rem;
        }

        .profile-dropdown {
            position: relative;
            cursor: pointer;
        }

        .profile-dropdown .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-dark);
            transition: var(--transition);
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
        }

        .profile-dropdown .user-avatar:hover {
            transform: scale(1.08);
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .profile-dropdown .dropdown-menu {
            position: absolute;
            top: 48px;
            right: 0;
            min-width: 200px;
            background: var(--white);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--medium-gray);
            padding: 8px 0;
            display: none;
            z-index: 1000;
            animation: fadeInDown 0.3s ease;
        }

        .profile-dropdown .dropdown-menu.show {
            display: block;
        }

        .profile-dropdown .dropdown-menu .dropdown-header {
            padding: 10px 16px 8px;
            border-bottom: 1px solid var(--medium-gray);
            margin-bottom: 4px;
        }

        .profile-dropdown .dropdown-menu .dropdown-header .name {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .profile-dropdown .dropdown-menu .dropdown-header .email {
            font-size: 0.75rem;
            color: var(--text-gray);
            word-break: break-all;
        }

        .profile-dropdown .dropdown-menu .dropdown-item {
            padding: 10px 16px;
            color: var(--text-dark);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .profile-dropdown .dropdown-menu .dropdown-item:hover {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold);
        }

        .profile-dropdown .dropdown-menu .dropdown-item i {
            width: 20px;
            color: var(--gold);
            font-size: 0.9rem;
        }

        .profile-dropdown .dropdown-menu .dropdown-divider {
            height: 1px;
            background: var(--medium-gray);
            margin: 4px 0;
        }

        .profile-dropdown .dropdown-menu .dropdown-item.text-danger {
            color: #dc2626;
        }

        .profile-dropdown .dropdown-menu .dropdown-item.text-danger:hover {
            background: rgba(220, 38, 38, 0.08);
            color: #dc2626;
        }

        .profile-dropdown .dropdown-menu .dropdown-item.text-danger i {
            color: #dc2626;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-nav .user-name {
            display: none;
        }

        .top-nav .user-role {
            background: rgba(212, 175, 55, 0.15);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: var(--gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            white-space: nowrap;
        }

        .top-nav .logout-btn {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.75rem;
            padding: 5px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-nav .logout-btn:hover {
            color: #ff6b6b;
            border-color: rgba(255,107,107,0.3);
            background: rgba(255,107,107,0.08);
        }

        /* Responsive Breakpoints */
        @media (max-width: 991px) {
            .top-nav .user-role {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .page-container { padding: 15px 12px; }
            .page-header h2 { font-size: 1.3rem; }
            .event-card h5 { padding-right: 0; }
            .event-card .event-date-badge {
                position: relative;
                top: auto;
                right: auto;
                display: inline-block;
                margin-bottom: 8px;
                align-self: flex-start;
            }
            .filter-bar { gap: 6px; }
            .filter-bar .filter-btn { font-size: 0.7rem; padding: 4px 12px; }
            .top-nav .brand .brand-text { font-size: 1rem; }
            .top-nav .brand .brand-text small { display: none; }
            .top-nav .user-name { display: none; }
            .top-nav .nav-container { padding: 10px 12px; }
        }
        
        @media (max-width: 480px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .page-header > div:last-child {
                width: 100%;
                display: flex;
                gap: 8px;
            }
            .page-header > div:last-child .btn-outline-gold,
            .page-header > div:last-child .btn-gold {
                flex: 1;
                text-align: center;
            }
            .event-card .event-footer { flex-direction: column; align-items: stretch; }
            .event-card .event-footer .btn-register { width: 100%; text-align: center; }
            .top-nav .logout-btn { padding: 5px 10px; }
        }
    </style>
</head>
<body>

<!-- ===== TOP NAVIGATION ===== -->
<nav class="top-nav">
    <div class="nav-container">
        <a href="dashboard.html" class="brand">
            <img src="images/UAI4Dlogo.png" alt="UAI4D Logo" class="brand-logo">
            <span class="brand-text">UAI4D <span>Club</span> <small>UDOM</small></span>
        </a>
        <div class="nav-right">
            <div class="user-info">
                <span class="user-role" id="userRole">MEMBER</span>
                <div class="profile-dropdown">
                    <div class="user-avatar" id="userAvatar">M</div>
                    <div class="dropdown-menu" id="profileDropdown">
                        <div class="dropdown-header">
                            <div class="name" id="dropdownName">Member</div>
                            <div class="email" id="dropdownEmail">member@uai4d.com</div>
                        </div>
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user-circle"></i> My Profile</a>
                        <a href="profile.html#changePassword" class="dropdown-item"><i class="fas fa-key"></i> Change Password</a>
                        <div class="dropdown-divider"></div>
                        <a href="LoginServlet" class="dropdown-item text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
                <span class="user-name">Welcome, <span id="userFullName">Member</span></span>
                <a href="LoginServlet" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ============================================================
     PAGE CONTENT
     ============================================================ -->
<div class="page-container">

    <!-- ===== Page Header ===== -->
    <div class="page-header">
        <div>
            <h2><i class="fas fa-calendar-alt"></i> Events</h2>
            <div class="subtitle">Discover and register for upcoming club events</div>
        </div>
        <div>
            <a href="dashboard.html" class="btn-outline-gold me-2">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <a href="create-event.html" class="btn-gold admin-only" id="createEventBtn">
                <i class="fas fa-plus"></i> Create Event
            </a>
        </div>
    </div>

    <!-- ===== Filters ===== -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" data-filter="ongoing">Ongoing</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="workshop">Workshops</button>
        <button class="filter-btn" data-filter="hackathon">Hackathons</button>
        <button class="filter-btn" data-filter="meetup">Meetups</button>
    </div>

    <!-- ===== Events Grid ===== -->
    <div class="row g-4" id="eventsContainer">
        <div class="col-12 text-center py-5" id="eventsLoading">
            <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--gold);"></i>
            <p class="mt-2 text-muted">Loading events...</p>
        </div>
    </div>

</div>

<!-- ===== Register Modal ===== -->
<div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background: var(--white); border-radius: var(--radius);">
            <div class="modal-header" style="border-bottom: 2px solid var(--gold);">
                <h5 class="modal-title" style="font-weight: 700;">
                    <i class="fas fa-check-circle" style="color: var(--gold);"></i> Confirm Registration
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to register for:</p>
                <h6 id="registerEventTitle" style="color: var(--gold); font-weight: 700;"></h6>
                <p class="text-muted" id="registerEventDate"></p>
                <p class="text-muted" id="registerEventLocation"></p>
            </div>
            <div class="modal-footer" style="border-top: 1px solid var(--medium-gray);">
                <button type="button" class="btn-outline-gold" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn-gold" id="confirmRegisterBtn">
                    <i class="fas fa-check"></i> Confirm Registration
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/events.js"></script>

</body>
</html>
